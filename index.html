<!DOCTYPE html>
<html lang="ca" data-theme="normal" class="m2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>El meu tauler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe6; --card:#ffffff; --ink:#17202e; --muted:#4b5666; --line:#d8cfc0;
  --brand:#0f6b73; --brand-ink:#ffffff; --ok:#15803d; --bad:#b91c1c; --focus:#f59e0b;
  --r:22px; --fs:18px;
}
html[data-theme=alt]{ --bg:#000; --card:#0c0c0c; --ink:#fff; --muted:#f0f0f0; --line:#fff; --brand:#ffe600; --brand-ink:#000; --ok:#4ade80; --bad:#ff6b6b; }
html{font-size:var(--fs);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.m1{scroll-snap-type:y proximity}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;
  font-family:'Atkinson Hyperlegible','Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.35;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
html[data-font=dys] body{font-family:'Lexend','Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:.02em;word-spacing:.08em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;width:100%}
label.f{display:block;font-weight:700;margin:14px 0 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}

/* ---------- Botons ---------- */
.btn{min-height:60px;padding:12px 22px;border-radius:18px;font-weight:700;font-size:1.05rem;background:var(--brand);color:var(--brand-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;border:3px solid transparent}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.big{min-height:76px;font-size:1.25rem;border-radius:22px}
.btn.block{display:flex;width:100%}
.btn:active{transform:scale(.97)}
.ibtn{width:60px;height:60px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:1.6rem;display:grid;place-items:center;flex:none}
html[data-theme=alt] .btn.ok,html[data-theme=alt] .btn.bad{color:#000}

/* ---------- Capçalera ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:3px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .hi{flex:1;min-width:0}
.top .hi b{display:block;font-size:1.3rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .hi small{color:var(--muted);font-size:.85rem}
.banner{margin:12px 14px 0;padding:14px 16px;border-radius:18px;background:#fff4d6;border:3px solid #f59e0b;color:#4a3300;font-weight:700;text-align:center}
html[data-theme=alt] .banner{background:#332900;color:#fff;border-color:#ffe600}

/* ---------- Tauler ---------- */
.board{display:flex;flex-direction:column;gap:18px;padding:16px 14px;max-width:760px;margin:0 auto}
html.m3 .board{max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
html.m1 .card{min-height:calc(100dvh - 190px);scroll-snap-align:start;scroll-margin-top:84px;display:flex;flex-direction:column}
html.m1 .card .card-b{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.08)}
html[data-theme=alt] .card{box-shadow:none}
.card-h{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;color:#fff;background:var(--c)}
.card-h .ic{font-size:1.7rem;line-height:1}
.card-h h2{font-size:1.15rem;flex:1;font-weight:700}
.say{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);font-size:1.5rem;color:#fff;flex:none;display:grid;place-items:center;border:2px solid rgba(255,255,255,.55)}
.card-b{padding:16px}
.next-hint{display:block;margin:14px auto 0;font-weight:700;color:var(--muted);font-size:.95rem}
.foot{padding:6px 18px 14px;text-align:center;font-size:.78rem;color:var(--muted)}
.foot a{color:inherit}

/* ---------- Swipe (llisca cap als costats) ---------- */
.sw-wrap{position:relative}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:0}
.swipe::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:2px 44px;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;justify-content:center}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-size:1.5rem;font-weight:700;display:grid;place-items:center;z-index:2}
.arr.l{left:-6px}.arr.r{right:-6px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--brand);width:28px;border-radius:8px}

/* ---------- Pictogrames i tessel·les ---------- */
.pict{width:var(--sz,64px);height:var(--sz,64px);display:grid;place-items:center;position:relative;flex:none}
.pict .pe{font-size:calc(var(--sz,64px)*.68);line-height:1}
.pict img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:14px;border:2px solid #e5e7eb}
.pict.img .pe{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{position:relative;border:3px solid var(--line);border-radius:18px;padding:12px 6px;min-height:118px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.92rem;text-align:center;line-height:1.15}
.tile[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.tile[aria-pressed=true]::after{content:'✓';position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:1rem}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:52px;border-radius:999px;border:3px solid var(--line);background:var(--card);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ---------- Segmentats i interruptors ---------- */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;min-height:56px;border:3px solid var(--line);border-radius:14px;font-weight:700;padding:8px 10px;background:var(--card)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.swrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:2px solid var(--line)}
.swrow>div{flex:1}.swrow small{display:block;color:var(--muted)}
.sw{width:76px;height:44px;border-radius:999px;background:var(--line);position:relative;flex:none;border:3px solid var(--line)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:left .15s}
.sw[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked=true]::after{left:32px}
.dot{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);flex:none}
.dot[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}

/* ---------- Pantalles a sobre (sheets) ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sheet-h{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:3px solid var(--line);background:var(--bg)}
.sheet-h .btn{min-height:56px;padding:8px 18px}
.sheet-t{font-weight:700;font-size:1.2rem;flex:1;min-width:0}
.sheet-b{overflow:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.sheet-b h3{margin:22px 0 10px;font-size:1.1rem}
.sheet-b h3:first-child{margin-top:0}
.acc{border:3px solid var(--line);border-radius:18px;margin-bottom:12px;background:var(--card);overflow:hidden}
.acc>button{width:100%;text-align:left;padding:16px;font-weight:700;font-size:1.1rem;display:flex;gap:12px;align-items:center;min-height:64px}
.acc>button span.cv{margin-left:auto;font-size:1.3rem}
.acc .acc-b{padding:4px 16px 18px;border-top:3px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px;border:3px solid var(--line);border-radius:16px;margin:8px 0;background:var(--card)}
.li .t{flex:1;min-width:0;font-weight:700}
.li .t small{display:block;font-weight:400;color:var(--muted)}
.mini{min-width:52px;min-height:52px;border-radius:14px;border:3px solid var(--line);font-weight:700;font-size:1.2rem;background:var(--card);display:grid;place-items:center;padding:0 10px}
.mini.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:2rem;flex:none;border:3px solid var(--line)}

/* ---------- Ajuda (sempre visible) ---------- */
.helpbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 35%);display:flex;justify-content:center;pointer-events:none}
.helpbtn{pointer-events:auto;min-height:68px;width:min(100%,560px);border-radius:22px;background:var(--bad);color:#fff;font-weight:700;font-size:1.3rem;
  display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 18px rgba(185,28,28,.45);border:4px solid #fff}
html[data-theme=alt] .helpbtn{color:#000;border-color:#000}

/* ---------- Rellotge ---------- */
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.clock-svg{width:min(78vw,330px);height:auto;display:block}
.digital{font-weight:700;font-size:clamp(3.6rem,22vw,6rem);line-height:1;letter-spacing:.02em;padding:22px 26px;border:6px solid var(--acc);background:var(--face);color:var(--ink2);min-width:min(86vw,340px);text-align:center;font-variant-numeric:tabular-nums}
.digital small{font-size:.35em;opacity:.8}
.cap{font-size:1.15rem;font-weight:700;text-align:center;min-height:2.6em}
.flag{width:46px;height:30px;border-radius:6px;border:2px solid rgba(0,0,0,.35);display:block;flex:none}

/* ---------- Avui, temps, etc. ---------- */
.bigday{font-size:2.1rem;font-weight:700;line-height:1.1;text-transform:capitalize}
.bigemoji{font-size:5rem;line-height:1}
.badge{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:700;background:#fde68a;color:#3b2a00}
.badge.red{background:#fecaca;color:#7f1d1d}
.badge.green{background:#bbf7d0;color:#14532d}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.face{border:3px solid var(--line);border-radius:18px;padding:10px 4px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;background:var(--card);font-size:.9rem}
.face[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand) inset}
.face .pe{font-size:2.6rem;line-height:1}
.steps .li.done{opacity:.6}.steps .li.done .t{text-decoration:line-through}
.prog{height:16px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ring{width:210px;height:210px}

/* ---------- Teclat PIN ---------- */
.pin-dots{display:flex;gap:16px;justify-content:center;margin:18px 0}
.pin-dots i{width:26px;height:26px;border-radius:50%;border:4px solid var(--ink);display:block}
.pin-dots i.on{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
.keypad button{min-height:74px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-size:1.8rem;font-weight:700}

/* ---------- Alarma ---------- */
.alarm{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;background:var(--a1)}
.alarm.flash{animation:flash 1s steps(2,jump-none) infinite}
@keyframes flash{0%{background:var(--a1)}50%{background:var(--a2)}100%{background:var(--a1)}}
.alarm .big{font-size:7rem;line-height:1}
.alarm h1{font-size:2.2rem;line-height:1.15}
.alarm p{font-size:1.3rem;font-weight:700}
.alarm .btn{width:min(100%,460px);background:#fff;color:#111;min-height:84px;font-size:1.35rem}
.alarm .btn.alt{background:transparent;color:#fff;border-color:#fff;min-height:64px}
.alarm .photo{width:130px;height:130px;border-radius:24px}
.mic-pulse{width:140px;height:140px;border-radius:50%;background:var(--bad);color:#fff;font-size:4rem;display:grid;place-items:center;margin:10px auto;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,28,28,.6)}100%{box-shadow:0 0 0 38px rgba(185,28,28,0)}}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:14px 20px;border-radius:16px;z-index:100;font-weight:700;max-width:90vw;text-align:center}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px 16px}
.hero h1{font-size:1.9rem;line-height:1.15}
.wiz{min-height:100dvh;padding:24px 16px calc(40px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;justify-content:center}
.stepdots{display:flex;gap:8px;justify-content:center}.stepdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.stepdots i.on{background:var(--brand)}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .alarm.flash,.mic-pulse{animation:none} .prog i,.sw::after{transition:none} }
html.calm .alarm.flash,html.calm .mic-pulse{animation:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   NUCLI (funcions pures, sense DOM): hora parlada, dates, festius,
   intèrpret de frases d'agenda i càlcul d'avisos.
   ============================================================ */
const Core = (() => {
  const DAYS = {
    ca: ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'],
    es: ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'],
  };
  const MONTHS = {
    ca: ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'],
    es: ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'],
  };
  const HN = {
    ca: ['', 'una', 'dues', 'tres', 'quatre', 'cinc', 'sis', 'set', 'vuit', 'nou', 'deu', 'onze', 'dotze'],
    es: ['', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce'],
  };
  const PERIOD = {
    ca: { dawn: 'de la matinada', morning: 'del matí', noon: 'del migdia', afternoon: 'de la tarda', evening: 'del vespre', night: 'de la nit' },
    es: { dawn: 'de la madrugada', morning: 'de la mañana', noon: 'del mediodía', afternoon: 'de la tarde', evening: 'de la noche', night: 'de la noche' },
  };

  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
  const h12 = (h) => (h % 12 === 0 ? 12 : h % 12);
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

  function periodKey(h) {
    if (h === 0) return 'night';
    if (h <= 4) return 'dawn';
    if (h <= 11) return 'morning';
    if (h <= 14) return 'noon';
    if (h <= 19) return 'afternoon';
    if (h <= 21) return 'evening';
    return 'night';
  }

  /* ---------- Hora parlada ---------- */
  function speakTime(d, lang, withPeriod = true) {
    let h = d.getHours();
    let m = Math.round(d.getMinutes() / 5) * 5;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
    const H = h12(h), N = h12(h + 1);
    const w = (n) => HN[lang][n];
    const art = (n) => (n === 1 ? 'la' : lang === 'ca' ? 'les' : 'las');
    const be = (n) => (n === 1 ? (lang === 'ca' ? 'És' : 'Es') : lang === 'ca' ? 'Són' : 'Son');
    let s;
    if (lang === 'ca') {
      const de = (n) => (n === 1 || n === 11 ? "d'" : 'de ');
      const rel = {
        0: `${be(H)} ${art(H)} ${w(H)} en punt`,
        5: `${be(H)} ${art(H)} ${w(H)} i cinc`,
        10: `${be(H)} ${art(H)} ${w(H)} i deu`,
        15: `És un quart ${de(N)}${w(N)}`,
        20: `${be(H)} ${art(H)} ${w(H)} i vint`,
        25: `${be(H)} ${art(H)} ${w(H)} i vint-i-cinc`,
        30: `Són dos quarts ${de(N)}${w(N)}`,
        35: `${be(N)} ${art(N)} ${w(N)} menys vint-i-cinc`,
        40: `${be(N)} ${art(N)} ${w(N)} menys vint`,
        45: `Són tres quarts ${de(N)}${w(N)}`,
        50: `${be(N)} ${art(N)} ${w(N)} menys deu`,
        55: `${be(N)} ${art(N)} ${w(N)} menys cinc`,
      };
      s = rel[m];
    } else {
      const rel = {
        0: `${be(H)} ${art(H)} ${w(H)} en punto`,
        5: `${be(H)} ${art(H)} ${w(H)} y cinco`,
        10: `${be(H)} ${art(H)} ${w(H)} y diez`,
        15: `${be(H)} ${art(H)} ${w(H)} y cuarto`,
        20: `${be(H)} ${art(H)} ${w(H)} y veinte`,
        25: `${be(H)} ${art(H)} ${w(H)} y veinticinco`,
        30: `${be(H)} ${art(H)} ${w(H)} y media`,
        35: `${be(N)} ${art(N)} ${w(N)} menos veinticinco`,
        40: `${be(N)} ${art(N)} ${w(N)} menos veinte`,
        45: `${be(N)} ${art(N)} ${w(N)} menos cuarto`,
        50: `${be(N)} ${art(N)} ${w(N)} menos diez`,
        55: `${be(N)} ${art(N)} ${w(N)} menos cinco`,
      };
      s = rel[m];
    }
    if (withPeriod) s += ' ' + PERIOD[lang][periodKey(h)];
    return s;
  }

  /* "a les onze del matí" (per a avisos de l'agenda) */
  function atTimeWords(d, lang) {
    const s = speakTime(d, lang, true);
    return 'a ' + s.replace(/^(Són|És|Son|Es)\s+/, '').replace(/^(un quart|dos quarts|tres quarts)/, '$1');
  }

  const monthDe = (mi, lang) => {
    const mn = MONTHS[lang][mi];
    if (lang === 'ca') return (/^[aeiou]/.test(mn) ? "d'" : 'de ') + mn;
    return 'de ' + mn;
  };
  const dayMonth = (d, lang) => `${d.getDate()} ${monthDe(d.getMonth(), lang)}`;
  const dateLong = (d, lang) => `${DAYS[lang][d.getDay()]}, ${dayMonth(d, lang)} ${lang === 'ca' ? 'de' : 'de'} ${d.getFullYear()}`;
  function speakDate(d, lang) {
    return (lang === 'ca' ? 'Avui és ' : 'Hoy es ') + `${DAYS[lang][d.getDay()]}, ${dayMonth(d, lang)}.`;
  }

  function dayWord(ts, now, lang) {
    const d = startOfDay(new Date(ts));
    const t = startOfDay(new Date(now));
    const diff = Math.round((d - t) / 86400000);
    if (diff === 0) return lang === 'ca' ? 'avui' : 'hoy';
    if (diff === 1) return lang === 'ca' ? 'demà' : 'mañana';

let actx = null;

      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);

}

  document.body.append(cv);

  let f = 0;
  (function loop() {

const PICT_KEY = 'andromines-pict-cache-v1';
let pictCache = {};

const pictQueue = [];
let pictActive = 0;
function pictPump() {
  while (pictActive < 4 && pictQueue.length) {
    const job = pictQueue.shift();
    pictActive++;
    fetch(`https://api.arasaac.org/v1/pictograms/${job.lang}/search/${encodeURIComponent(job.kw)}`)
      .then((r) => { if (!r.ok) throw new Error('http'); return r.json(); })
      .then((a) => {
        const id = Array.isArray(a) && a[0] ? a[0]._id : 0;
        pictCache[job.lang + ':' + job.kw] = id;
        try { localStorage.setItem(PICT_KEY, JSON.stringify(pictCache)); } catch (e) { /* res */ }
        job.res(id);
      })
      .catch(() => job.res(null))
      .finally(() => { pictActive--; pictPump(); });
  }
}

  return new Promise((res) => { pictQueue.push({ kw, lang, res }); pictPump(); });
}

}

  due.forEach((d) => { if (!alarmState.queue.find((q) => q.key === d.key)) alarmState.queue.push(d); });

        icon = Core.guessIcon(title);

        saveB.disabled = !ts || !title;

      [tI, dI, hI].forEach((i) => i.addEventListener('input', read));

/* ---------- TEMPS ---------- */
const Wx = { data: null, city: '', err: null, loading: false, at: 0, subs: [] };
try { const c = JSON.parse(localStorage.getItem('andromines-wx')); if (c && c.data) Object.assign(Wx, c); } catch (e) { /* res */ }
function locate() {
  return new Promise((resolve, reject) => {
    const viaIP = () => fetch('https://ipwho.is/').then((r) => r.json()).then((j) => (j && j.latitude ? resolve({ lat: j.latitude, lon: j.longitude, approx: true }) : reject(new Error('ip')))).catch(reject);
    if (!('geolocation' in navigator)) return viaIP();
    navigator.geolocation.getCurrentPosition((p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }), viaIP, { timeout: 8000, maximumAge: 600000 });
  });
}
async function wxFetch(force) {
  if (Wx.loading || (!force && Wx.data && Date.now() - Wx.at < 20 * 60000)) return;
  Wx.loading = true; Wx.err = null; Wx.subs.forEach((f) => f());
  try {
    const loc = await locate();
    const [w, g] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`).then((r) => r.json()),
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${loc.lat}&longitude=${loc.lon}&localityLanguage=${S.lang}`).then((r) => r.json()).catch(() => ({})),
    ]);
    if (!w.current) throw new Error('no data');
    Wx.data = { cur: w.current, day: w.daily }; Wx.city = g.city || g.locality || ''; Wx.at = Date.now();
    try { localStorage.setItem('andromines-wx', JSON.stringify({ data: Wx.data, city: Wx.city, at: Wx.at })); } catch (e) { /* res */ }
  } catch (e) { Wx.err = true; }
  Wx.loading = false; Wx.subs.forEach((f) => f());
}
function wxSummary() {
  if (!Wx.data) return T('Encara no tinc el temps.', 'Aún no tengo el tiempo.');
  const c = Wx.data.cur, d = Wx.data.day;
  const wi = Core.weatherInfo(c.weather_code, c.is_day, S.lang);
  const rain = (d.precipitation_probability_max || [0])[0] || 0;
  const of = Core.outfit(c.apparent_temperature, rain, S.lang).map((o) => o.t).join(', ');
  return T(`Ara fa ${Math.round(c.temperature_2m)} graus. ${wi.t}. Avui, màxima de ${Math.round(d.temperature_2m_max[0])} i mínima de ${Math.round(d.temperature_2m_min[0])}. Et recomano: ${of}.`, `Ahora hace ${Math.round(c.temperature_2m)} grados. ${wi.t}. Hoy, máxima de ${Math.round(d.temperature_2m_max[0])} y mínima de ${Math.round(d.temperature_2m_min[0])}. Te recomiendo: ${of}.`);
}
Blocks.weather = () => {
  const root = h('div', { class: 'stack' });
  const render = () => {
    root.replaceChildren();
    if (!Wx.data) {
      root.append(emptyMsg(Wx.err ? '📡' : '⏳', Wx.err ? T('No puc veure el temps ara', 'No puedo ver el tiempo ahora') : T('Mirant el temps…', 'Mirando el tiempo…')),
        Wx.err ? h('button', { class: 'btn alt block', onclick: () => wxFetch(true) }, '🔄 ' + T('Torna-ho a provar', 'Inténtalo otra vez')) : null);
      return;
    }
    const c = Wx.data.cur, d = Wx.data.day;
    const wi = Core.weatherInfo(c.weather_code, c.is_day, S.lang);
    const rain = (d.precipitation_probability_max || [0])[0] || 0;
    const of = Core.outfit(c.apparent_temperature, rain, S.lang);
    const sw = Swipe([
      h('div', { class: 'stack center', style: 'width:100%' }, h('div', { class: 'bigemoji' }, wi.e), h('div', { style: 'font-size:3rem;font-weight:700' }, Math.round(c.temperature_2m) + '°'), h('div', { style: 'font-size:1.3rem;font-weight:700' }, wi.t), h('div', { class: 'muted' }, T('Sensació: ', 'Sensación: ') + Math.round(c.apparent_temperature) + '°')),
      h('div', { class: 'stack center', style: 'width:100%' }, h('div', { class: 'bigemoji' }, '📈'), h('div', { style: 'font-size:1.5rem;font-weight:700' }, T('Avui', 'Hoy')), h('div', { style: 'font-size:1.6rem;font-weight:700' }, `⬆ ${Math.round(d.temperature_2m_max[0])}°   ⬇ ${Math.round(d.temperature_2m_min[0])}°`), h('span', { class: 'badge' + (rain >= 50 ? ' red' : '') }, '☔ ' + T('Pluja: ', 'Lluvia: ') + rain + ' %')),
      h('div', { class: 'stack center', style: 'width:100%' }, h('div', { style: 'font-size:1.4rem;font-weight:700' }, T('Què em poso?', '¿Qué me pongo?')), h('div', { class: 'chips' }, of.map((o) => h('span', { class: 'chip', style: 'font-size:1.15rem' }, o.e + ' ' + o.t)))),
    ]);
    root.append(sw.el, h('div', { class: 'row', style: 'justify-content:center' }, h('span', { class: 'muted' }, '📍 ' + (Wx.city || T('La teva zona', 'Tu zona')) + ' · ' + hhmm(new Date(Wx.at))), h('button', { class: 'mini', 'aria-label': T('Actualitza', 'Actualiza'), onclick: () => wxFetch(true) }, '🔄')));
  };
  Wx.subs = Wx.subs.filter(() => false); Wx.subs.push(render);
  render(); wxFetch(false);
  return { body: root, speak: wxSummary };
};

Blocks.routines = () => {

  const day = Core.ymd(new Date());

    const box = h('div', { class: 'stack', style: 'width:100%' });

      const done = new Set(S.routDone[k] || []);

        h('div', { class: 'center', style: 'font-size:1.4rem;font-weight:700' }, L(r.name)),
        h('div', { class: 'prog', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': r.steps.length, 'aria-valuenow': done.size }, h('i', { style: `width:${(done.size / Math.max(1, r.steps.length)) * 100}%` })),
        h('div', { class: 'center muted' }, `${done.size} / ${r.steps.length}`),
        h('div', { class: 'steps' }, r.steps.map((sid, i) => {
          const a = actionById(sid) || { e: '▫️', ca: sid, es: sid };
          const isDone = done.has(i);
          return h('button', { class: 'li' + (isDone ? ' done' : ''), style: 'width:100%;text-align:left', 'aria-pressed': String(isDone), onclick: () => {
            const cur = new Set(S.routDone[k] || []);
            if (cur.has(i)) cur.delete(i); else { cur.add(i); say(L(a)); }
            S.routDone = Object.fromEntries(Object.entries(S.routDone).filter(([kk]) => kk.startsWith(day)));
            S.routDone[k] = [...cur]; save(); draw();
            if (cur.size === r.steps.length && !isDone) { confetti(); say(T('Molt bé! Has acabat la rutina.', '¡Muy bien! Has terminado la rutina.')); }
          } }, pictEl(a, 56), h('div', { class: 't' }, L(a)), h('span', { style: 'font-size:1.8rem' }, isDone ? '✅' : '⬜'));

function teamSearch(sportId, done) {

    } else if (step === 1) {

      w.append(h('div', { class: 'hero' }, h('div', { class: 'bigemoji' }, '😊'), h('h1', null, T('Com et dius?', '¿Cómo te llamas?')), h('button', { class: 'ibtn', onclick: () => say(T('Com et dius?', '¿Cómo te llamas?')), 'aria-label': T('Escolta', 'Escucha') }, '🔊')),

/* ---------- Arrencada ---------- */
function boot() {
  Voice.init();
  applyTheme();
  document.body.append(helpBar);
  updateHelpLabel();
  const unlock = () => {
    if (Voice.unlocked) return;
    Voice.unlocked = true;
    try { if (Voice.ok) speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) { /* res */ }
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) { /* res */ }
    const b = document.querySelector('.banner'); if (b) b.remove();
  };
  document.addEventListener('pointerdown', unlock, { passive: true });
  App.render();
  let n = 0;
  setInterval(() => { App.tick(new Date()); if (++n % 5 === 0 && S.setup) runAlarms(); }, 1000);
  setTimeout(() => { if (S.setup) runAlarms(); }, 800);
  applyWakeLock();
}
boot();
